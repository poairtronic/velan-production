# ==============================================================================
# Velan Production — Docker Compose (Local Development Environment)
# Coordinates independent Backend (Spring Boot) and Frontend (Vite + React)
# Note: Zero database containers. Neon PostgreSQL deferred to Phase 7.
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velan-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT:-8080}
      - SPRING_PROFILES_ACTIVE=local
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_DIRECT_URL=${DATABASE_DIRECT_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - velan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: velan-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    networks:
      - velan-network

networks:
  velan-network:
    driver: bridge
