name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: velan_ci
          POSTGRES_USER: velan_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: local
      # CI-only dummy Base64-encoded 32+ byte value (not a real secret)
      JWT_SECRET: Q0lfT05MWV9EVU1NWV9KV1RfU0VDUkVUXzMyX0JZVEVTXzEyMzQ=
      DATABASE_URL: jdbc:postgresql://localhost:5432/velan_ci
      DATABASE_DIRECT_URL: jdbc:postgresql://localhost:5432/velan_ci
      DB_USER: velan_ci
      DB_PASSWORD: ci_only_password
      REQUIRE_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B clean verify
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: velan_ci
          POSTGRES_USER: velan_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t velan-backend:ci -f backend/Dockerfile backend
      - name: Start container and verify readiness
        run: |
          docker run -d --name velan-smoke --network host \
            -e SPRING_PROFILES_ACTIVE=staging \
            -e PORT=8080 \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/velan_ci \
            -e DATABASE_DIRECT_URL=jdbc:postgresql://localhost:5432/velan_ci \
            -e DB_USER=velan_ci \
            -e DB_PASSWORD=ci_only_password \
            -e FLYWAY_USER=velan_ci \
            -e FLYWAY_PASSWORD=ci_only_password \
            -e JWT_SECRET=Q0lfT05MWV9EVU1NWV9KV1RfU0VDUkVUXzMyX0JZVEVTXzEyMzQ= \
            -e CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            -e SCHEDULING_ENABLED=false \
            -e STORAGE_TYPE=disabled \
            velan-backend:ci

          trap 'docker logs velan-smoke || true; docker rm -f velan-smoke || true' EXIT

          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health/readiness || true)
            if [ "$STATUS" = "200" ] && curl -sf http://localhost:8080/actuator/health/readiness | grep -q '"UP"'; then
              echo "Container readiness is UP"
              exit 0
            fi
            sleep 2
          done

          echo "Container readiness did not become UP within 120 seconds"
          exit 1

  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    environment: staging
    steps:
      - name: Trigger Render staging deploy hook
        env:
          HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_STAGING_DEPLOY_HOOK is not set; skipping staging deploy."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"
