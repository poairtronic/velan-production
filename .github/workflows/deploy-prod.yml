name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render production deploy hook
        env:
          HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_PROD_DEPLOY_HOOK is not set; skipping production deploy."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"
