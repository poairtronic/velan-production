# Production profile configuration (all values from environment variables; fail-fast on missing secrets)
spring:
  datasource:
    url: ${DATABASE_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      keepalive-time: 0
  flyway:
    enabled: true
    url: ${DATABASE_DIRECT_URL:}
    user: ${FLYWAY_USER:}
    password: ${FLYWAY_PASSWORD:}

app:
  database:
    url: ${DATABASE_URL:}
    direct-url: ${DATABASE_DIRECT_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    require-database-config: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    require-cors-origins: true
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    require-jwt-secret: true

logging:
  level:
    com.velan.production: ${LOG_LEVEL:INFO}
