# Local development profile configuration (safe defaults; no default secrets)
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  datasource:
    url: ${DATABASE_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: false
    url: ${DATABASE_DIRECT_URL:}
    user: ${DB_USER:}
    password: ${DB_PASSWORD:}

app:
  database:
    url: ${DATABASE_URL:}
    direct-url: ${DATABASE_DIRECT_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    require-database-config: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    require-cors-origins: false
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root: ${STORAGE_LOCAL_ROOT:./.data/files}
  security:
    jwt-secret: ${JWT_SECRET:REVWX09OTFlfSlVTVF9GT1JfTE9DQUxfVEVTVElOR18zMl9CWVRFUw==}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    require-jwt-secret: false
    jwt:
      secret: ${JWT_SECRET:REVWX09OTFlfSlVTVF9GT1JfTE9DQUxfVEVTVElOR18zMl9CWVRFUw==}

logging:
  level:
    com.velan.production: ${LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
