# Local development profile configuration (safe defaults; no default secrets)
spring:
  datasource:
    url: ${DATABASE_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    require-cors-origins: false
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    require-jwt-secret: false

logging:
  level:
    com.velan.production: ${LOG_LEVEL:DEBUG}
