# Local database verification profile (DataSource + HikariCP enabled; Flyway disabled)
spring:
  datasource:
    url: ${DATABASE_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      keepalive-time: 0
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    require-cors-origins: false
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    require-jwt-secret: false

logging:
  level:
    com.velan.production: ${LOG_LEVEL:DEBUG}
