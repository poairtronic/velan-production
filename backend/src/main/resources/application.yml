# Velan Production Backend Configuration (profile-neutral)
spring:
  application:
    name: velan-production-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

app:
  timezone: ${TZ:UTC}
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:24h}
  security:
    jwt:
      access-ttl: ${JWT_ACCESS_TTL:PT1H}
      refresh-ttl: ${JWT_REFRESH_TTL:PT12H}
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}
  cache:
    default-ttl: PT10M
    default-max-size: 1000
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    zone: ${SCHEDULING_ZONE:Asia/Kolkata}
  integration:
    rm:
      enabled: ${RM_SYNC_ENABLED:false}
    ecr:
      enabled: ${ECR_SEND_ENABLED:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%thread] %logger{36} - %msg%n"
