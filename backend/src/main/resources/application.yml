# Velan Production Backend Configuration (profile-neutral)
spring:
  application:
    name: velan-production-backend
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

app:
  timezone: ${TZ:UTC}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%thread] %logger{36} - %msg%n"
